# Keeps the free Render instance awake, and with it the Aiven PostgreSQL and Valkey services:
# /health runs `SELECT 1` and a Redis `PING`, so every run is real traffic on all three. Anyone
# who opens the link gets the game right away instead of a ~50 s cold start, and the free
# database services never look idle.
#
# Runs from the public repository (GitHub Actions minutes are free there); on a private
# repository the job is skipped - use an external monitor instead (docs/DEPLOY.md).
name: Keep alive

on:
    schedule:
        - cron: '*/10 * * * *'
    workflow_dispatch:

permissions:
    actions: write

jobs:
    ping:
        if: ${{ !github.event.repository.private }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Ping /health
              run: |
                  for attempt in 1 2 3; do
                    if curl --fail --silent --show-error --max-time 60 https://kardux-battle.onrender.com/health; then
                      exit 0
                    fi
                    sleep 20
                  done
                  exit 1

            # GitHub disables scheduled workflows after 60 days without commits in a public
            # repository; this re-enables the workflow through the API, without committing.
            # A third-party action (gautamkrishnar/keepalive-workflow) used to do this, but its
            # repository is blocked by GitHub for a ToS violation, which failed every run of this
            # job - calling the REST API directly needs nothing beyond the actions:write
            # permission already granted above.
            - name: Keep the schedule enabled
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
